[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/image",
    "crates/geom",
    "crates/nodes",
    "crates/eval",
    "crates/formats",
    "crates/engine",
    "crates/render",
    "crates/automation",
    "crates/ui-egui",
    "apps/materialcraft",
    "apps/materialcraft-cli",
    "apps/materialcraft-web",
    "xtask",
]
exclude = ["vendor"]
# The web app only builds for wasm32 (trunk); everything else is the default.
default-members = [
    "crates/core",
    "crates/image",
    "crates/geom",
    "crates/nodes",
    "crates/eval",
    "crates/formats",
    "crates/engine",
    "crates/render",
    "crates/automation",
    "crates/ui-egui",
    "apps/materialcraft",
    "apps/materialcraft-cli",
    "xtask",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/materialcraft"

[workspace.dependencies]
resvg = { version = "0.47", default-features = false }
# internal
materialcraft-core = { path = "crates/core" }
materialcraft-image = { path = "crates/image" }
materialcraft-geom = { path = "crates/geom" }
materialcraft-nodes = { path = "crates/nodes" }
materialcraft-eval = { path = "crates/eval" }
materialcraft-formats = { path = "crates/formats" }
materialcraft-engine = { path = "crates/engine" }
materialcraft-render = { path = "crates/render" }
materialcraft-automation = { path = "crates/automation" }
materialcraft-ui-egui = { path = "crates/ui-egui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "tiff", "exr", "hdr", "bmp", "webp", "gif", "pnm"] }
dds = { version = "0.2", default-features = false }
half = "2"
eframe = { version = "0.37", default-features = false }
egui = "0.37"
wgpu = "30"
rfd = "0.17"
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
tobj = { version = "4", default-features = false }
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
schemars = "1"
base64 = "0.22"
roxmltree = "0.20"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cap-std = "4"
getrandom = "0.3"
# Shared Craft egui components (widget palette, icon buttons, panel docking): storytold/craft-libs,
# MIT OR Apache-2.0, every craft-libs crate pinned to one rev.
egui_kittest = "0.37"
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["serde"] }
# Keyboard bindings (chords, dispatch and display text): storytold/craft-libs, MIT OR Apache-2.0.
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }
# Native dialogs that do not block the event loop: storytold/craft-libs, MIT OR Apache-2.0.
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }
# The platform quit and the macOS Quit menu item: storytold/craft-libs, MIT OR Apache-2.0.
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }
# Who draws the window frame, and an app-drawn strip as the title bar: storytold/craft-libs, MIT OR Apache-2.0.
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }
# Release checks and self-updates for the desktop app: storytold/craft-libs, MIT OR Apache-2.0.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }

# egui 0.37 and winit: the suite's forks (storytold/egui, storytold/winit), as craft-libs pins them.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
# egui-phosphor has no release for egui 0.37 (vendor/egui-phosphor/VENDORED.md).
egui-phosphor = { path = "vendor/egui-phosphor" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Index loops read better than zipped iterators in per-pixel code.
needless_range_loop = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Fast optimized verification: each test executable otherwise repeats cross-crate LTO
# `false` keeps thin LTO within each crate; release packaging keeps the profile above
[profile.verify]
inherits = "release"
lto = false
codegen-units = 16

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Node cooking and the vector math under it run per pixel.
[profile.wasm-release.package.materialcraft-image]
opt-level = 3
[profile.wasm-release.package.materialcraft-nodes]
opt-level = 3
[profile.wasm-release.package.materialcraft-render]
opt-level = 3
[profile.wasm-release.package.glam]
opt-level = 3
