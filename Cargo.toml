[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/geom",
    "crates/nodes",
    "crates/eval",
    "crates/formats",
    "crates/engine",
    "crates/render",
    "crates/automation",
    "crates/ui-egui",
    "apps/materialcraft",
    "apps/materialcraft-cli",
    "apps/materialcraft-web",
    "xtask",
]
exclude = ["vendor"]
# The web app only builds for wasm32 (trunk); everything else is the default.
default-members = [
    "crates/core",
    "crates/geom",
    "crates/nodes",
    "crates/eval",
    "crates/formats",
    "crates/engine",
    "crates/render",
    "crates/automation",
    "crates/ui-egui",
    "apps/materialcraft",
    "apps/materialcraft-cli",
    "xtask",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Standard Base64 output; strict SBS decoding remains app-local
craft-mime = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", version = "0.1.0" }
# Read 3D meshes through craft-mesh; keep mesh processing app-local
craft-mesh = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", default-features = false, features = ["obj", "gltf"] }
# Shared XML escaping and bounded XML parsing; SBS model and serialization policy stay app-local
craft-xml = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Shared SBS package/schema parsing, sniffing, embedded codec, and envelope writing (storytold/craft-libs#2496)
craft-sbs = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Shared bounded ZIP archive reader and deterministic writer (storytold/craft-libs#2411)
craft-zip = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Bound SVG parsing and drawing through craft-svg
craft-svg = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", features = ["tree-render"] }
# Shared raster image codecs
craft-image-codecs = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# internal
materialcraft-core = { path = "crates/core" }
materialcraft-geom = { path = "crates/geom" }
materialcraft-nodes = { path = "crates/nodes" }
materialcraft-eval = { path = "crates/eval" }
materialcraft-formats = { path = "crates/formats" }
materialcraft-engine = { path = "crates/engine" }
materialcraft-render = { path = "crates/render" }
materialcraft-automation = { path = "crates/automation" }
materialcraft-ui-egui = { path = "crates/ui-egui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10" # MIT OR Apache-2.0; stable content keys for persistent previews.
glam = { version = "0.30", features = ["serde", "bytemuck"] }
rayon = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "tiff", "exr", "hdr", "bmp", "webp", "gif", "pnm"] }
dds = { version = "0.2", default-features = false }
half = "2"
eframe = { version = "0.37", default-features = false }
egui = "0.37"
rfd = "0.17"
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
schemars = "1"
base64 = "0.22"
roxmltree = "0.21"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cap-std = "4"
getrandom = "0.3"
# Shared Craft egui components from storytold/craft-libs
# MIT OR Apache-2.0
egui_kittest = "0.37"
craft-materialx = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# MCMAT v3 uses its merged archive revision and the matching ZIP crate
craft-mcmat = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Keyboard bindings (chords, dispatch and display text): storytold/craft-libs, MIT OR Apache-2.0
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", features = ["egui"] }
# Native dialogs that do not block the event loop: storytold/craft-libs, MIT OR Apache-2.0
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-platform = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# The platform quit and the macOS Quit menu item: storytold/craft-libs, MIT OR Apache-2.0
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", features = ["ui"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Who draws the window frame, and an app-drawn strip as the title bar: storytold/craft-libs, MIT OR Apache-2.0
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", features = ["ui"] }
# Release checks and self-updates for the desktop app: storytold/craft-libs, MIT OR Apache-2.0
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", features = ["ui"] }
# The framework crates the shell stubs name (contract sh.A*): storytold/craft-libs
craft-behavior = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-tracked = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Atomic persistence, at the suite's current revision
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
craft-png = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Parse the optional shared font catalog at build time; the font repository is not a dependency
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541" }
# Float image planes and texture sampling for node cooking: storytold/craft-libs, MIT OR Apache-2.0
craft-texture = { git = "https://github.com/storytold/craft-libs", rev = "0b8bbaf4c842da2d47de7b3fddd7170ba6115541", features = ["parallel"] }

# egui 0.37 and winit: the suite's forks (storytold/egui, storytold/winit), as craft-libs pins them.
[patch.crates-io]
# BEGIN port-kit framework overrides
krilla = { path = "../craft-libs/vendor/krilla" }
hayro = { path = "../craft-libs/vendor/hayro" }
hayro-interpret = { path = "../craft-libs/vendor/hayro-interpret" }
hayro-syntax = { path = "../craft-libs/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../craft-libs/vendor/hayro-jbig2" }
hayro-cmap = { path = "../craft-libs/vendor/hayro-cmap" }
hayro-postscript = { path = "../craft-libs/vendor/hayro-postscript" }
linesweeper = { path = "../craft-libs/vendor/linesweeper" }
vello_common = { path = "../craft-libs/vendor/vello_common" }
vello_cpu = { path = "../craft-libs/vendor/vello_cpu" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
emath = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# END port-kit framework overrides
# port-kit overridden: ecolor = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: emath = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: epaint = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: egui = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: egui-winit = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: egui_glow = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: eframe = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# port-kit overridden: winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# port-kit overridden: egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
# egui-phosphor has no release for egui 0.37 (vendor/egui-phosphor/VENDORED.md).
egui-phosphor = { path = "vendor/egui-phosphor" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Index loops read better than zipped iterators in per-pixel code.
needless_range_loop = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Fast optimized verification: each test executable otherwise repeats cross-crate LTO
# `false` keeps thin LTO within each crate; release packaging keeps the profile above
[profile.verify]
inherits = "release"
lto = false
codegen-units = 16

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Node cooking and the vector math under it run per pixel.
[profile.wasm-release.package.craft-texture]
opt-level = 3
[profile.wasm-release.package.materialcraft-nodes]
opt-level = 3
[profile.wasm-release.package.materialcraft-render]
opt-level = 3
[profile.wasm-release.package.glam]
opt-level = 3

[workspace.metadata.cl]
selection = ["materialcraft", "materialcraft-ui-egui"]
tracked = ["egui", "eframe"]
unset_env = ["MATERIALCRAFT_BUILD_CHANNEL", "MATERIALCRAFT_VERSION", "MATERIALCRAFT_BUILD_SHA", "MATERIALCRAFT_BUILD_DATE", "MATERIALCRAFT_REQUIRE_WINRES", "SOURCE_DATE_EPOCH"]

# BEGIN port-kit framework patch
[patch."https://github.com/storytold/craft-libs"]
craft-appkit = { path = "../craft-libs/crates/appkit" }
craft-atomic = { path = "../craft-libs/crates/atomic" }
