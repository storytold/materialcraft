[package]
name = "materialcraft-cli"
description = "Headless MaterialCraft: info, run, batch, cook, export, render, MCP server, JSON-lines server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "materialcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "materialcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
materialcraft-automation = { workspace = true }
materialcraft-engine = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
